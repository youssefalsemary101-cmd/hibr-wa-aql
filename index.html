<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#10233f">
  <meta name="description" content="حبر وعقل التعليمية - نموذج أولي لمنصة تعليمية عربية">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>حبر وعقل التعليمية</title>
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="القائمة">☰</button>
    <a class="brand" href="#" id="brandHome"><span class="brand-icon">✦</span><span>حبر وعقل<small> التعليمية</small></span></a>
    <div class="top-actions"><button id="notifyBtn" class="icon-btn" title="الإشعارات">♧</button><button id="accountBtn" class="icon-btn" title="الحساب">◉</button></div>
  </header>

  <aside id="sideMenu" class="side-menu hidden">
    <button class="nav-item" data-page="home">⌂ الرئيسية</button>
    <button class="nav-item" data-page="subjects">▤ موادي الدراسية</button>
    <button class="nav-item" data-page="tests">✓ الاختبارات</button>
    <button class="nav-item" data-page="teachers">♙ المعلمون</button>
    <button class="nav-item" data-page="friends">♧ الأصدقاء والمجموعات</button>
    <button class="nav-item" data-page="referrals">✧ الدعوات والمكافآت</button>
    <button class="nav-item" data-page="profile">⚙ إعدادات الحساب</button>
    <button class="nav-item admin-only hidden" data-page="admin">▦ لوحة الإدارة</button>
    <button id="logoutBtn" class="nav-item danger">↪ تسجيل الخروج</button>
    <p class="side-note">حبر وعقل • نموذج تجريبي</p>
  </aside>
  <div id="shade" class="shade hidden"></div>

  <main id="app" class="main">
    <section id="authView" class="auth-wrap">
      <div class="auth-brand"><div class="big-mark">✦</div><h1>حبر وعقل</h1><p>بالعلم نصنع مستقبلًا أفضل</p></div>
      <div class="auth-card">
        <div class="tabs"><button class="tab active" data-auth="login">تسجيل الدخول</button><button class="tab" data-auth="register">إنشاء حساب</button></div>
        <form id="loginForm" class="form">
          <label>رقم الهاتف المصري<input id="loginPhone" inputmode="numeric" maxlength="11" placeholder="01XXXXXXXXX" required></label>
          <label>كلمة المرور<input id="loginPassword" type="password" placeholder="كلمة المرور" required></label>
          <button class="primary full" type="submit">تسجيل الدخول</button>
          <p class="hint">للتجربة: أنشئ حسابًا من تبويب «إنشاء حساب». لا توجد حسابات جاهزة.</p>
        </form>
        <form id="registerForm" class="form hidden">
          <label>اسم الطالب<input id="regName" maxlength="50" placeholder="اكتب اسمك" required></label>
          <label>اسم مستخدم فريد<input id="regUsername" maxlength="24" placeholder="مثال: student123" required></label>
          <label>رقم الهاتف المصري<input id="regPhone" inputmode="numeric" maxlength="11" placeholder="010 أو 011 أو 012..." required></label>
          <label>كلمة المرور<input id="regPassword" type="password" minlength="6" placeholder="6 أحرف على الأقل" required></label>
          <label>المرحلة
            <select id="regStage" required>
              <option value="">اختر المرحلة</option><option>الابتدائية</option><option>الإعدادية</option><option>الثانوية العامة</option><option>البكالوريا</option>
            </select>
          </label>
          <label>الصف<select id="regGrade" required><option value="">اختر المرحلة أولًا</option></select></label>
          <label id="trackLabel" class="hidden">الشعبة أو المسار<select id="regTrack"><option value="">اختر القسم</option></select></label>
          <button class="primary full" type="submit">إنشاء الحساب</button>
          <p class="hint">هذا النموذج يحفظ البيانات على هذا الجهاز فقط، وليس نظام تسجيل إنتاجيًا.</p>
        </form>
        <div id="authMessage" class="message hidden"></div>
      </div>
    </section>

    <section id="contentView" class="hidden">
      <div class="welcome-panel">
        <div><p class="eyebrow">مساحتك التعليمية</p><h1 id="welcomeTitle">أهلًا بك</h1><p id="scopeText">محتوى مناسب لصفك وقسمك</p></div>
        <div class="welcome-symbol">✦</div>
      </div>
      <div class="searchbar"><span>⌕</span><input id="searchInput" placeholder="ابحث في دروسك وموادك..." aria-label="بحث"><button id="clearSearch" title="مسح">×</button></div>
      <div id="pageContent"></div>
    </section>
  </main>

  <nav id="bottomNav" class="bottom-nav hidden">
    <button data-page="home" class="active"><span>⌂</span>الرئيسية</button>
    <button data-page="subjects"><span>▤</span>المواد</button>
    <button data-page="tests"><span>✓</span>الاختبارات</button>
    <button data-page="profile"><span>◉</span>حسابي</button>
  </nav>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
